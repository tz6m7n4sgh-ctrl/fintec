name: Deploy to GitHub Pages

# Builds the static export and publishes it to GitHub Pages.
#
# The verify job gates the deploy: tests, typecheck and build must all pass
# before anything is published, so a red suite cannot reach the live page. On
# pull requests the verify job runs alone — it never deploys — which also gives
# PRs a real status check to gate merges on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer commit supersedes an in-flight run, but never cancels a deploy
  # half-way through publishing.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        env:
          # GitHub Pages serves a project site from /<repo>, so the base path
          # must match the repository name.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Confirm the export produced an index page
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/.nojekyll || { echo "::error::out/.nojekyll missing — Jekyll would strip _next/"; exit 1; }
          echo "Exported $(find out -name index.html | wc -l) pages"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # Runs against the exact artefact about to be deployed, served under the
        # same sub-path GitHub Pages will use — so a broken asset path or a
        # sub-path routing regression fails here rather than in production.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lighthouse CI
        # Measures the artefact that is about to deploy. Gives NFR-9 a number:
        # nothing asserted page performance before this. Thresholds and the
        # reasoning behind them live in lighthouserc.js.
        env:
          # Must match the build above. Without it Lighthouse requests the site
          # at / while the export references /fintec/_next/..., so every asset
          # 404s and it scores an unstyled page instead of the real one.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run test:lighthouse

      - name: Which Lighthouse audits failed
        # lhci names the category it rejected but not the audit behind it, and
        # the category score is a weighted composite. Runs even when the step
        # above already failed the job — that is exactly when it is needed.
        if: always()
        run: node scripts/lh-failing-audits.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
          # .lighthouseci is a dotfile directory, and upload-artifact@v4 skips
          # hidden files by default — without this the upload silently finds
          # nothing, which is how the first failing run lost its reports.
          include-hidden-files: true

      - name: Upload Pages artifact
        # Only the run that will deploy needs the artifact.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publish
    # Pull requests stop at verify — they must never publish to the live site.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # No configure-pages step: it exists to hand the build a base_path, and
      # this workflow derives that from the repository name instead.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
