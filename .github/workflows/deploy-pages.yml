name: Deploy to GitHub Pages

# Builds the static export and publishes it to GitHub Pages.
#
# The verify job gates the deploy: tests, typecheck and build must all pass
# before anything is published, so a red suite cannot reach the live page. On
# pull requests the verify job runs alone — it never deploys — which also gives
# PRs a real status check to gate merges on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer commit supersedes an in-flight run, but never cancels a deploy
  # half-way through publishing.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        env:
          # GitHub Pages serves a project site from /<repo>, so the base path
          # must match the repository name.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Confirm the export produced an index page
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/.nojekyll || { echo "::error::out/.nojekyll missing — Jekyll would strip _next/"; exit 1; }
          echo "Exported $(find out -name index.html | wc -l) pages"

      - name: Upload Pages artifact
        # Only the run that will deploy needs the artifact.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publish
    # Pull requests stop at verify — they must never publish to the live site.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # No configure-pages step: it exists to hand the build a base_path, and
      # this workflow derives that from the repository name instead.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
