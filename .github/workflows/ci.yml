name: CI

# Verifies every push and pull request.
#
# This workflow used to build a static export and publish it to GitHub Pages.
# The app is now a server build, which Pages cannot host — a static host has no
# server boundary, and that boundary is what protects real financial data once
# row-level security stops being the only thing in the way.
#
# So there is no deploy job here. Deployment now needs a Node host (Vercel, Fly,
# a container — see the README). That is a provisioning step outside this repo,
# and a deploy job that cannot actually run would be worse than none.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # Runs against a production `next start` server — the same server that
        # runs in production, rather than a stand-in. The stand-in it replaced
        # was itself the source of two defects that produced plausible but wrong
        # results: a base-path mismatch and missing compression.
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lighthouse CI
        # Gives NFR-9 a number. Thresholds and the reasoning behind them live in
        # lighthouserc.js.
        run: npm run test:lighthouse

      - name: Which Lighthouse audits failed
        # lhci names the category it rejected but not the audit behind it, and
        # the category score is a weighted composite. Runs even when the step
        # above already failed the job — that is exactly when it is needed.
        if: always()
        run: node scripts/lh-failing-audits.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
          # .lighthouseci is a dotfile directory, and upload-artifact@v4 skips
          # hidden files by default — without this the upload silently finds
          # nothing, which is how the first failing run lost its reports.
          include-hidden-files: true
