name: CI

# Verifies every push and pull request.
#
# This workflow used to build a static export and publish it to GitHub Pages.
# The app is now a server build, which Pages cannot host — a static host has no
# server boundary, and that boundary is what protects real financial data once
# row-level security stops being the only thing in the way.
#
# So there is no deploy job here. Deployment now needs a Node host (Vercel, Fly,
# a container — see the README). That is a provisioning step outside this repo,
# and a deploy job that cannot actually run would be worse than none.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Secret guard
        # Fails if a credential reached .env.example or the client bundle. Runs
        # after Build because the bundle check needs .next/static to exist.
        # Verified able to go red — a planted service-role JWT trips it.
        run: node scripts/secret-guard.mjs

      - name: Dependency audit — production tree
        # Blocking at `critical` only, and only over dependencies that actually
        # ship.
        #
        # Gated at `high`, not `critical`. It sat at `critical` because three
        # high advisories lived inside Next's own tree with no patched 15.x to
        # move to, so gating at `high` would have meant a permanently red build
        # — and a check that is always red is one people learn to ignore.
        #
        # That is no longer true. `overrides` in package.json pin patched
        # postcss and sharp into Next's tree, and `npm audit --omit=dev` now
        # reports **0 vulnerabilities**. See HAD-78: the upgrade path the issue
        # proposed does not work — next@16.2.12 pins the same postcss 8.4.31 as
        # 15.5.22 and sharp ^0.34.5, both still inside the advisory ranges — so
        # overriding is what actually closes them.
        #
        # If this goes red, a new advisory has landed in a production
        # dependency. That is the signal it exists for. Do not lower it back.
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit — full report
        # Informational. Runs even when something above failed, because a build
        # that broke is exactly when you want to see what moved.
        if: always()
        run: npm audit --omit=dev || true

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # Runs against a production `next start` server — the same server that
        # runs in production, rather than a stand-in. The stand-in it replaced
        # was itself the source of two defects that produced plausible but wrong
        # results: a base-path mismatch and missing compression.
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lighthouse CI
        # Gives NFR-9 a number. Thresholds and the reasoning behind them live in
        # lighthouserc.js.
        run: npm run test:lighthouse

      - name: Which Lighthouse audits failed
        # lhci names the category it rejected but not the audit behind it, and
        # the category score is a weighted composite. Runs even when the step
        # above already failed the job — that is exactly when it is needed.
        if: always()
        run: node scripts/lh-failing-audits.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
          # .lighthouseci is a dotfile directory, and upload-artifact@v4 skips
          # hidden files by default — without this the upload silently finds
          # nothing, which is how the first failing run lost its reports.
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  # SEC-1 — cross-tenant isolation.
  #
  # Separate job because it needs a database, while `verify` deliberately runs
  # unconfigured. It is the only check here that can fail for a reason that is
  # a data-exposure incident rather than a bug.
  #
  # The SQL runs inside a transaction that always rolls back, so pointing this
  # at the live project is safe — and the live project is the only place the
  # real policies exist. Testing a copy would repeat the mistake that produced
  # two earlier defects on this repo.
  # ---------------------------------------------------------------------------
  isolation:
    name: SEC-1 cross-tenant isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove isolation holds
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # TODO: set this to '1' once SUPABASE_DB_URL is configured in repo
          # secrets. Until then the job reports loudly and passes, because a
          # gate that has never been given credentials would otherwise block
          # every PR. Once it is set, a missing secret becomes a failure —
          # which is the point: a security check that silently does not run is
          # indistinguishable from one that passes.
          RLS_REQUIRED: '0'
        run: npm run test:rls
